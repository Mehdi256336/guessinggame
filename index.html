<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guessing Game - Mehdi</title>
<style>
body{font-family:Arial;text-align:center;background:#f0f0f0;padding:20px}
.box{background:white;max-width:400px;margin:auto;padding:25px;border-radius:15px;box-shadow:0 0 15px #ccc}
input{padding:10px;width:80%;font-size:18px;text-align:center;margin:10px}
button{padding:10px 20px;font-size:18px;background:#2ea44f;color:white;border:none;border-radius:8px;cursor:pointer}
#msg{font-size:20px;margin:15px;font-weight:bold}
</style>
</head>
<body>
<div class="box">
<h1>🎯 Guessing Game</h1>
<p>I'm thinking of a number between 1 and 100</p>
<p>Can you guess it?</p>
<input type="number" id="guess" placeholder="Enter 1 - 100" min="1" max="100">
<br>
<button onclick="check()">Guess</button>
<button onclick="resetGame()">Restart</button>
<p id="msg"></p>
<p id="tries">Attempts: 0</p>
</div>
<script>
let secret = Math.floor(Math.random()*100)+1;
let attempts = 0;
function check(){
let g = document.getElementById('guess').value;
let msg = document.getElementById('msg');
if(!g){msg.textContent="Please enter a number!";return;}
attempts++;
document.getElementById('tries').textContent="Attempts: "+attempts;
g = Number(g);
if(g === secret){msg.textContent="🎉 Correct! You win in "+attempts+" tries!";msg.style.color="green";}
else if(g < secret){msg.textContent="Too Low! Try higher ⬆️";msg.style.color="orange";}
else{msg.textContent="Too High! Try lower ⬇️";msg.style.color="red";}
}
function resetGame(){
secret = Math.floor(Math.random()*100)+1;
attempts=0;
document.getElementById('tries').textContent="Attempts: 0";
document.getElementById('msg').textContent="";
document.getElementById('guess').value="";
}
</script>
</body>
</html>
